name: 紙芝居を組み立てる
on:
  push:
    branches: [main]
    paths: ["kamishibai/text.js", "kamishibai/assets/**", "kamishibai/build.sh"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: kamishibai-build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: ./kamishibai/build.sh
      - name: index.html を commit
        run: |
          git config user.name "kamishibai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add kamishibai/index.html
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "紙芝居を組み立て直した（text.js の変更から）[skip ci]"
          git push
