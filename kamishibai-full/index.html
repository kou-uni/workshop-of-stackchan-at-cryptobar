<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ｽﾀｯｸﾁｬﾝｷﾞｬｻﾞﾘﾝｸﾞ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Noto+Serif+JP:wght@700;900&display=swap">
<style>
:root{
  --sky1:#8FDBF5; --sky2:#BDEBF8; --sky3:#E4F6FC;
  --blue:#2E9BE0; --blued:#1A73C4; --blueL:#CFEBFA;
  --grass:#55C96A; --grassL:#DCF5DF;
  --yel:#FFC831; --yelL:#FFF2CC; --yelD:#B37C00;
  --red:#FF6B6B; --redL:#FFE2E2;
  --pur:#9B7BF0; --purL:#EDE6FF;
  --ora:#FF9F40;
  --card:#FFFFFF; --ink:#173A54; --ink2:#4E7590; --ink3:#87A6BC;
  --sh:0 6px 0 rgba(23,58,84,.10),0 12px 28px rgba(23,58,84,.14);
  --shS:0 4px 0 rgba(23,58,84,.09),0 8px 18px rgba(23,58,84,.12);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--ink);
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 42%,var(--sky3) 100%);
  background-attachment:fixed;
  font-family:"M PLUS Rounded 1c",-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN",sans-serif;
  font-size:17px;line-height:1.8;font-weight:700;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.cloud{position:fixed;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(28px);pointer-events:none;z-index:0}
.c1{width:58vw;height:26vw;max-width:420px;max-height:190px;top:6%;left:-14%;animation:dr1 26s ease-in-out infinite}
.c2{width:46vw;height:22vw;max-width:340px;max-height:160px;top:46%;right:-12%;animation:dr2 32s ease-in-out infinite}
.c3{width:40vw;height:18vw;max-width:290px;max-height:130px;bottom:8%;left:8%;animation:dr1 38s ease-in-out infinite reverse}
@keyframes dr1{0%,100%{transform:translate(0,0)}50%{transform:translate(16%,-9%)}}
@keyframes dr2{0%,100%{transform:translate(0,0)}50%{transform:translate(-18%,11%)}}

.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;overflow-x:hidden;
  margin-top:calc(-1 * env(safe-area-inset-top,0px))}
img,svg{max-width:100%}

/* ===== 上部 ===== */
.top{position:sticky;top:0;z-index:40;
  background:rgba(255,255,255,.80);backdrop-filter:blur(16px);
  border-bottom:3px solid rgba(255,255,255,.92);box-shadow:0 6px 20px rgba(23,58,84,.10);
  border-radius:0 0 26px 26px}
.top-in{max-width:880px;margin:0 auto;padding:9px 16px 11px;display:flex;align-items:center;gap:12px}
.brand{font-family:"Noto Serif JP",serif;font-weight:900;font-size:20px;flex:none;color:var(--blued)}
.brand i{font-style:normal;color:var(--blue);font-size:11px;letter-spacing:.18em;margin-left:6px;font-family:"M PLUS Rounded 1c",sans-serif}
.chaps{display:flex;gap:6px;flex:1;min-width:0}
.chap{flex:1;min-width:12px;display:flex;gap:3px}
.chap .b{height:8px;flex:1;border-radius:99px;background:rgba(23,58,84,.14);border:0;padding:0;cursor:pointer;transition:all .3s}
.chap .b.done{background:var(--blue)}
.chap .b.on{background:var(--yel);box-shadow:0 0 0 3px rgba(255,200,49,.35);transform:scaleY(1.4)}
.chap .b:focus-visible{outline:3px solid var(--blued);outline-offset:3px}
.stepn{font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums;flex:none;font-weight:800}

main{flex:1;max-width:880px;width:100%;margin:0 auto;padding:0 18px;
  display:flex;flex-direction:column;justify-content:center;
  padding-block:14px calc(124px + env(safe-area-inset-bottom,0px))}
.step{display:none}
.step.on{display:block;animation:sl .5s cubic-bezier(.18,1.15,.32,1) both}
@keyframes sl{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:none}}

/* ===== 章扉 ===== */
.cover{text-align:center;padding-block:10px 18px}
.cover .num{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:900;font-size:clamp(88px,26vw,170px);line-height:1;
  color:#fff;text-shadow:0 8px 0 var(--blue),0 16px 30px rgba(23,58,84,.25);animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-16px) rotate(1.5deg)}}
.cover .ttl{font-weight:900;font-size:clamp(34px,9vw,54px);margin-top:6px;color:var(--blued)}
.cover .sub{color:var(--ink2);margin-top:10px;font-size:17px}

/* ===== 人物札 ===== */
.who{display:inline-flex;align-items:center;gap:11px;padding:7px 20px 7px 7px;border-radius:99px;
  background:var(--card);margin-bottom:18px;font-size:15px;max-width:100%;box-shadow:var(--shS)}
.who .av{width:42px;height:42px;border-radius:99px;display:grid;place-items:center;
  font-weight:900;font-size:20px;color:#fff;flex:none;animation:pu 2.2s ease-in-out infinite;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.who b{font-weight:900;flex:none;font-size:17px}
.who span{color:var(--ink3);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== 見出し ===== */
.big{font-weight:900;line-height:1.36;font-size:clamp(32px,8.4vw,54px);margin:0 0 16px;
  text-wrap:balance;color:var(--blued);letter-spacing:-.01em}
.big em{font-style:normal;color:#fff;-webkit-text-stroke:0;text-shadow:0 4px 0 var(--blue),0 8px 16px rgba(23,58,84,.2)}
.big .o,.big .mark{font-style:normal;color:#fff;text-shadow:0 4px 0 var(--ora),0 8px 16px rgba(23,58,84,.2)}
.big .r,.big .no{font-style:normal;color:#fff;text-shadow:0 4px 0 var(--red),0 8px 16px rgba(23,58,84,.2)}
.say{font-size:clamp(16px,3.2vw,19px);color:var(--ink2);margin:0 0 22px;max-width:34ch;text-wrap:balance}
.say b{color:var(--ink);font-weight:900}
.tiny{font-size:14.5px;color:var(--ink2);line-height:1.8}

/* ===== カード ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.card{background:var(--card);border-radius:26px;padding:20px 19px;box-shadow:var(--sh);
  animation:bg .6s cubic-bezier(.2,1.6,.4,1) both}
.card .k{font-size:13px;letter-spacing:.06em;color:#fff;font-weight:900;margin-bottom:10px;
  background:var(--blue);display:inline-block;padding:3px 13px;border-radius:99px}
.card .v{font-weight:900;font-size:23px;line-height:1.4;color:var(--blued)}
.card .d{font-size:15px;color:var(--ink2);margin-top:8px;line-height:1.75;font-weight:700}
@keyframes bg{from{opacity:0;transform:translateY(26px) scale(.86)}to{opacity:1;transform:none}}
.step.on .card:nth-child(1){animation-delay:.08s} .step.on .card:nth-child(2){animation-delay:.2s}
.step.on .card:nth-child(3){animation-delay:.32s} .step.on .card:nth-child(4){animation-delay:.44s}

/* ===== 引用 ===== */
.quote{background:var(--card);border-radius:26px;padding:20px 22px;margin:0 0 14px;box-shadow:var(--sh);
  border-left:9px solid var(--red);animation:bg .55s cubic-bezier(.2,1.5,.4,1) both}
.quote:nth-of-type(2){animation-delay:.16s;border-left-color:var(--ora)}
.quote p{margin:0;font-size:19px;font-weight:900;line-height:1.7;color:var(--ink)}
.quote cite{display:block;font-style:normal;font-size:13.5px;color:var(--ink3);margin-top:9px;font-weight:700}

/* ===== 数 ===== */
.nums{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 22px}
.num{background:var(--card);border-radius:24px;padding:15px 16px;box-shadow:var(--shS);
  animation:bg .6s cubic-bezier(.2,1.6,.4,1) both;flex:1 1 104px;min-width:104px}
.num:nth-child(2){animation-delay:.13s} .num:nth-child(3){animation-delay:.26s}
.num .n{font-weight:900;font-size:clamp(34px,8.6vw,60px);line-height:1.05;font-variant-numeric:tabular-nums;color:var(--blue)}
.num .u{font-size:19px;margin-left:2px;font-weight:900}
.num .l{font-size:13.5px;color:var(--ink2);margin-top:4px;line-height:1.55}
.num.ok .n{color:var(--grass)} .num.st .n{color:var(--ora)} .num.dn .n{color:var(--red)}

/* ===== 関係図 ===== */
.panel{background:var(--card);border-radius:28px;padding:22px 20px;box-shadow:var(--sh)}
.bubble{position:relative;margin-top:34px;background:var(--yel);color:#4A3200;
  border-radius:28px;padding:20px 24px;font-weight:900;
  box-shadow:0 7px 0 #D9A100,0 16px 30px rgba(23,58,84,.2);
  animation:fy 3s ease-in-out infinite}
@keyframes fy{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-11px) rotate(.6deg)}}
.bubble::before{content:"";position:absolute;top:-14px;left:36px;
  border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:16px solid var(--yel)}
.bubble .tag{display:inline-block;font-size:13px;background:rgba(74,50,0,.16);
  border-radius:99px;padding:3px 14px;margin-bottom:10px}
.bubble p{margin:0;font-size:20px;line-height:1.65;text-wrap:balance}
.bubble ul{margin:12px 0 0;padding-left:1.15em;font-size:15.5px;line-height:1.8}
.bubble li{margin-bottom:5px}

/* ===== ガイド（下部チュートリアル） ===== */
.guide{position:fixed;left:0;right:0;bottom:0;z-index:60;isolation:isolate;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-top:30px;
  background:linear-gradient(to top,var(--sky3) 58%,rgba(228,246,252,.88) 82%,rgba(228,246,252,0));
  pointer-events:none}
.guide-in>*{pointer-events:auto}
.guide-in{max-width:880px;margin:0 auto;padding:0 18px}
.talkwrap{position:relative;z-index:1;isolation:isolate;margin-bottom:14px;
  animation:tup .42s cubic-bezier(.18,1.25,.35,1) both}
.talk{position:relative;z-index:2;background:var(--card);border-radius:26px;
  padding:18px 20px;box-shadow:var(--sh);
  max-height:42svh;overflow-y:auto;overscroll-behavior:contain}
@keyframes tup{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
.talk::after{content:"";position:absolute;bottom:-13px;left:26px;
  border-left:14px solid transparent;border-right:14px solid transparent;border-top:15px solid var(--card)}
.talk .t{font-size:16.5px;line-height:1.9;font-weight:700;color:var(--ink)}
/* 吹き出しから立体的に飛び出すキャラクター */
.charwrap{position:absolute;left:18px;bottom:calc(100% - 64px);top:auto;
  width:244px;max-width:56%;z-index:1;display:block;padding:0;border:0;background:none;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transform-origin:bottom center;
  animation:charpop .62s cubic-bezier(.2,1.85,.35,1) both,
            charbob 3.4s ease-in-out .62s infinite}
.charwrap:focus-visible{outline:4px solid var(--yel);outline-offset:6px;border-radius:24px}
.char{width:100%;display:block;opacity:1;transform-origin:bottom center;
  filter:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff)
         drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff)
         drop-shadow(0 10px 14px rgba(23,58,84,.26))}
@keyframes charpop{
  0%{transform:translateY(34px) scale(.5) rotate(-10deg)}
  100%{transform:translateY(0) scale(1) rotate(-2deg)}}
@keyframes charbob{
  0%,100%{transform:translateY(0) rotate(-2.6deg) scale(1)}
  50%{transform:translateY(-14px) rotate(2.6deg) scale(1.035)}}
@media(max-width:430px){
  .charwrap{width:200px;left:12px;bottom:calc(100% - 54px)}}
.talk .t b{color:var(--blued);font-weight:900}
.nav{display:flex;gap:9px;align-items:center}
.gbtn{position:relative;width:58px;height:58px;border-radius:99px;flex:none;border:0;cursor:pointer;padding:0;
  background:var(--blueL);
  box-shadow:0 5px 0 rgba(23,58,84,.2),0 10px 20px rgba(46,155,224,.3),inset 0 0 0 3px #fff;
  display:grid;place-items:center;transition:transform .12s,box-shadow .12s;overflow:visible}
.gbtn:active{transform:translateY(5px) scale(.94,.9);box-shadow:0 0 0 rgba(23,58,84,.2)}
.gbtn .face{font-size:24px;font-weight:900;color:#fff;
  display:grid;place-items:center;width:100%;height:100%;
  background:linear-gradient(150deg,var(--blue),var(--pur));border-radius:99px;
  animation:pu 2.6s ease-in-out infinite}
.charSm{width:100%;height:100%;border-radius:99px;object-fit:cover;object-position:50% 30%;display:block;
  animation:pu 2.6s ease-in-out infinite}
.gbtn .badge{position:absolute;top:-4px;right:-4px;width:24px;height:24px;border-radius:99px;
  background:var(--yel);color:#4A3200;font-size:14px;display:grid;place-items:center;
  box-shadow:0 2px 0 #D9A100;animation:bn 1.4s ease-in-out infinite}
.gbtn[aria-expanded="true"] .badge{display:none}
.gbtn[aria-expanded="true"] .charSm,
.gbtn[aria-expanded="true"] .face{filter:grayscale(.55) brightness(.92);animation:none}
.gbtn:focus-visible{outline:4px solid var(--yel);outline-offset:3px}
.btn{font:inherit;font-size:17px;font-weight:900;border-radius:99px;cursor:pointer;
  padding:14px 20px;border:0;background:var(--card);color:var(--ink);box-shadow:0 5px 0 rgba(23,58,84,.16);
  transition:transform .12s,box-shadow .12s;white-space:nowrap;flex:none}
.btn:active{transform:translateY(5px) scale(.96,.93);box-shadow:0 0 0 rgba(23,58,84,.16)}
.btn.go{background:linear-gradient(180deg,#5FC3F0,var(--blue));color:#fff;
  flex:1 1 auto;min-width:0;max-width:none;padding-inline:18px;
  box-shadow:0 6px 0 var(--blued),0 12px 24px rgba(46,155,224,.4);animation:bn 2s ease-in-out infinite}
@keyframes bn{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.btn.go:active{animation:none;transform:translateY(5px) scale(.97,.94);box-shadow:0 1px 0 var(--blued)}
.btn:focus-visible{outline:4px solid var(--yel);outline-offset:3px}
.btn[disabled]{opacity:.4;cursor:not-allowed;animation:none}
.pagetag{align-self:flex-start;max-width:100%;
  font-size:16px;font-weight:900;color:var(--blued);background:var(--card);
  padding:9px 20px;border-radius:99px;box-shadow:var(--shS);margin-bottom:14px;
  animation:tagin .45s cubic-bezier(.2,1.5,.4,1) both;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes tagin{from{opacity:0;transform:translateX(-18px) scale(.9)}to{opacity:1;transform:none}}

.pill{display:inline-block;font-size:14px;font-weight:900;padding:7px 17px;border-radius:99px;
  background:var(--blueL);color:var(--blued);margin:0 7px 8px 0}
.pill.no{background:var(--redL);color:#C43D3D}
.pill.yes{background:var(--grassL);color:#2E8C42}
.memo{margin-top:22px;padding:18px 20px;background:var(--card);border-radius:24px;
  box-shadow:var(--shS);font-size:15.5px;color:var(--ink2);line-height:1.85;border-left:9px solid var(--blue)}
.memo b{color:var(--blued);font-weight:900}
.rule{height:3px;background:rgba(23,58,84,.12);border-radius:3px;margin:24px 0}

/* ===== 役割 ===== */
.role{display:flex;flex-direction:column;gap:16px}
.rc{background:var(--card);border-radius:28px;padding:22px 20px;box-shadow:var(--sh);
  animation:bg .6s cubic-bezier(.2,1.6,.4,1) both}
.rc:nth-child(2){animation-delay:.16s}
.rc.lead{box-shadow:0 7px 0 var(--grass),0 14px 30px rgba(85,201,106,.3)}
.rc .hd{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.rc .av{width:54px;height:54px;border-radius:99px;display:grid;place-items:center;flex:none;
  font-weight:900;font-size:25px;color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.16);animation:pu 2.6s ease-in-out infinite}
.rc .nm{font-size:22px;font-weight:900;line-height:1.25;color:var(--ink)}
.rc .rl{font-size:13.5px;color:var(--ink3);font-weight:800}
.rc ol,.rc ul{margin:0;padding-left:1.25em;font-size:16.5px;line-height:1.9;font-weight:700}
.rc li{margin-bottom:4px}
.rc li b{color:var(--blued);font-weight:900}
.entrust{margin-bottom:14px;background:var(--grassL);border-radius:20px;padding:14px 17px;
  font-size:17px;font-weight:900;color:#2E8C42;line-height:1.65}
.fact{margin-top:13px;background:var(--purL);border-radius:18px;padding:12px 16px;
  font-size:15px;font-weight:800;color:#5E42B8;line-height:1.7}
.together{background:var(--yel);border-radius:26px;padding:20px;text-align:center;margin-top:18px;
  font-size:19px;font-weight:900;line-height:1.65;color:#4A3200;
  box-shadow:0 7px 0 #D9A100,0 14px 26px rgba(23,58,84,.18);animation:fy 3.4s ease-in-out infinite}
/* ===== キラキラ ===== */
#fx{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.star{position:absolute;transform:translate(-50%,-50%);will-change:transform,opacity}
.star svg{width:100%;height:100%;display:block;
  filter:drop-shadow(0 2px 5px rgba(23,58,84,.22))}
.mute{flex:none;width:34px;height:34px;border-radius:99px;border:0;cursor:pointer;
  background:rgba(23,58,84,.07);font-size:16px;line-height:1;padding:0;
  display:grid;place-items:center;transition:transform .12s,background .2s}
.mute:active{transform:scale(.88,.84)}
.mute[aria-pressed="true"]{opacity:.45}
.mute:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* ===== 次にやること ===== */
.todo{display:flex;flex-direction:column;gap:13px;margin-top:6px}
.tdo{display:flex;gap:15px;align-items:flex-start;background:var(--card);border-radius:24px;
  padding:18px 18px;box-shadow:var(--sh);text-decoration:none;color:inherit;
  animation:bg .55s cubic-bezier(.2,1.6,.4,1) both;transition:transform .12s,box-shadow .12s}
.tdo:nth-child(2){animation-delay:.14s} .tdo:nth-child(3){animation-delay:.28s}
a.tdo:active{transform:translateY(4px) scale(.98,.96);box-shadow:var(--shS)}
.tdo .no{width:40px;height:40px;border-radius:99px;flex:none;display:grid;place-items:center;
  font-weight:900;font-size:19px;color:#fff;background:var(--blue);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.16)}
.tdo .tt{font-size:18px;font-weight:900;color:var(--blued);line-height:1.4}
.tdo .td{font-size:14.5px;color:var(--ink2);margin-top:5px;line-height:1.7}
.tdo .lk{display:inline-block;margin-top:8px;font-size:14px;font-weight:900;color:#fff;
  background:var(--blue);padding:6px 16px;border-radius:99px;word-break:break-all}
.tdo .lk.g{background:var(--grass)} .tdo .lk.p{background:var(--pur)}

/* ===== 目標 ===== */
.goals{display:flex;flex-direction:column;gap:14px}
.goal{background:var(--card);border-radius:26px;padding:20px 20px 20px 18px;box-shadow:var(--sh);
  display:flex;gap:16px;align-items:flex-start;animation:bg .6s cubic-bezier(.2,1.6,.4,1) both}
.goal:nth-child(2){animation-delay:.16s} .goal:nth-child(3){animation-delay:.32s}
.goal .medal{width:52px;height:52px;border-radius:99px;flex:none;display:grid;place-items:center;
  font-size:25px;font-weight:900;color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.16);
  animation:pu 2.5s ease-in-out infinite}
.goal .gt{font-size:21px;font-weight:900;color:var(--blued);line-height:1.4}
.goal .gd{font-size:15.5px;color:var(--ink2);margin-top:6px;line-height:1.75}
.goal .gd b{color:var(--ink);font-weight:900}
.callout{margin-top:22px;background:linear-gradient(160deg,#FFD84D,var(--yel));border-radius:30px;
  padding:28px 22px;text-align:center;color:#4A3200;
  box-shadow:0 9px 0 #D9A100,0 18px 34px rgba(23,58,84,.2);animation:fy 3s ease-in-out infinite}
.callout .l1{font-size:clamp(19px,4.6vw,25px);font-weight:900;line-height:1.55}
.callout .l2{font-size:clamp(28px,7.6vw,44px);font-weight:900;line-height:1.35;margin-top:10px}
.spark{display:inline-block;animation:sp 1.5s ease-in-out infinite}
@keyframes sp{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.25) rotate(12deg)}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

</style>
<body>
<script>
/* 紙芝居 kamishibai — ガイド付きウォークスルーのエンジン
   内容は content/*.js 側に書く。ここは触らなくてよい。 */
(function(global){
'use strict';

const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ========== 内容を書くための部品 ========== */
const K = {
  /* 誰の視点か */
  who(p){ return `<div class="who"><span class="av" style="background:${p.color||'var(--blue)'}">${esc(p.initial||'◆')}</span><b>${esc(p.name)}</b>${p.note?`<span>${esc(p.note)}</span>`:''}</div>`; },
  /* 人ではなく仕組みの説明 */
  sys(t){ return K.who({name:t, initial:'◆', color:'linear-gradient(150deg,var(--blue),var(--pur))'}); },
  /* 大見出し。<em> で青、<mark class="o"> で橙、<mark class="r"> で赤の縁取り */
  head(html){ return `<h1 class="big">${html}</h1>`; },
  lead(html){ return `<p class="say">${html}</p>`; },
  tiny(html){ return `<p class="tiny">${html}</p>`; },
  /* 横に並ぶカード */
  cards(list){ return `<div class="cards">${list.map(c =>
    `<div class="card">${c.k?`<div class="k">${esc(c.k)}</div>`:''}<div class="v"${c.color?` style="color:${c.color}"`:''}>${c.v}</div>${c.d?`<div class="d">${c.d}</div>`:''}</div>`).join('')}</div>`; },
  /* 大きい数字。count:true でカウントアップ */
  nums(list){ return `<div class="nums">${list.map(n =>
    `<div class="num ${n.tone||''}"><div class="n"${n.count?` data-to="${n.count}"`:''}>${n.count?0:n.n}</div><div class="l">${n.label}</div></div>`).join('')}</div>`; },
  /* 黄色い吹き出し（確認ポイント） */
  ask(tag, q, items){ return `<div class="bubble"><span class="tag">${esc(tag)}</span><p>${q}</p>${
    items&&items.length?`<ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul>`:''}</div>`; },
  memo(html){ return `<div class="memo">${html}</div>`; },
  pill(t, tone){ return `<span class="pill ${tone||''}">${t}</span>`; },
  quote(t, cite){ return `<div class="quote"><p>${t}</p>${cite?`<cite>${esc(cite)}</cite>`:''}</div>`; },
  rule(){ return '<div class="rule"></div>'; },
  /* 番号つきの目標リスト */
  goals(list){ return `<div class="goals">${list.map((g,i)=>
    `<div class="goal"><span class="medal" style="background:${g.color||'var(--blue)'}">${i+1}</span><div><div class="gt">${g.title}</div><div class="gd">${g.body}</div></div></div>`).join('')}</div>`; },
  /* 行動導線（リンクにもできる） */
  todo(list){ return `<div class="todo">${list.map((t,i)=>{
    const inner = `<span class="no"${t.color?` style="background:${t.color}"`:''}>${i+1}</span><div><div class="tt">${t.title}</div><div class="td">${t.body}</div>${t.link?`<span class="lk">${t.link.label}</span>`:''}</div>`;
    return t.link?`<a class="tdo" href="${t.link.href}" target="_blank" rel="noopener">${inner}</a>`:`<div class="tdo">${inner}</div>`;
  }).join('')}</div>`; },
  callout(html){ return `<div class="callout">${html}</div>`; },
};

/* ========== 音（Web Audio でその場で合成。音源ファイルは要らない） ========== */
let AC = null, soundOn = true, voice = 'soft';
const SEQ = {
  next:[1046.5,1318.5,1568,2093], fin:[1046.5,1318.5,1568,2093,2637],
  tap:[1568,2093,2637], open:[1318.5,1760], back:[880,659.3]
};
/* ぴこぴこ（sound:'chip'）。矩形波・単音・短いゲート・余韻なし。
   ゲーム機の効果音の作り: 音を重ねず、切るときはスパッと切る。 */
const CHIP = {
  next:[1046.5,1318.5,1568,2093], fin:[784,1046.5,1318.5,1568,2093,2637,3136],
  tap:[1568,3136], open:[1318.5,2637], back:[1318.5,880]
};
function chipChime(kind){
  const t0 = AC.currentTime + 0.01, master = AC.createGain();
  master.gain.value = 0.06; master.connect(AC.destination);      /* 矩形波は大きいので絞る */
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200;
  lp.connect(master);                                            /* 高域の刺さりだけ落とす */
  const seq = CHIP[kind] || CHIP.next;
  const step = kind === 'fin' ? 0.07 : kind === 'tap' ? 0.045 : 0.06;
  const gate = step * 0.8;                                       /* 音の間に一瞬の無音 ＝ ぴこぴこ感 */
  seq.forEach((f, i) => {
    const t = t0 + i * step;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'square'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(1, t + 0.002);                /* 立ち上がりは即 */
    g.gain.setValueAtTime(1, t + gate - 0.012);
    g.gain.linearRampToValueAtTime(0.0001, t + gate);            /* 余韻なし、スパッと */
    o.connect(g); g.connect(lp); o.start(t); o.stop(t + gate + 0.01);
  });
  if(kind === 'fin'){                                            /* 最後だけ、和音で「ジャン」 */
    const t = t0 + seq.length * step;
    [2093, 2637, 3136].forEach(f => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.7, t + 0.002);
      g.gain.setValueAtTime(0.7, t + 0.22);
      g.gain.linearRampToValueAtTime(0.0001, t + 0.26);
      o.connect(g); g.connect(lp); o.start(t); o.stop(t + 0.28);
    });
  }
}
function chime(kind){
  if(!soundOn) return;
  try{
    AC = AC || new (global.AudioContext || global.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    if(voice === 'chip'){ chipChime(kind); return; }
    const t0 = AC.currentTime + 0.01, master = AC.createGain();
    master.gain.value = 0.15; master.connect(AC.destination);
    const seq = SEQ[kind] || SEQ.next;
    const step = kind === 'fin' ? 0.075 : kind === 'tap' ? 0.04 : 0.055;
    seq.forEach((f, i) => {
      const t = t0 + i * step;
      [0, 8].forEach((det, k) => {
        const o = AC.createOscillator(), g = AC.createGain();
        o.type = 'sine'; o.frequency.value = f; o.detune.value = det;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(k ? 0.3 : 1, t + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0008, t + 0.55);
        o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.6);
      });
    });
    if(kind === 'next' || kind === 'fin'){            /* 最後の「リーン」 */
      const t = t0 + seq.length * step + 0.02;
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'triangle'; o.frequency.value = kind === 'fin' ? 3136 : 2637;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.45, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0008, t + 1.2);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + 1.3);
    }
  }catch(e){ /* 音が出せない環境でも本体は動かす */ }
}

/* ========== キラキラ ========== */
const STAR = '<svg viewBox="0 0 24 24"><path d="M12 .8c1.15 6.9 4.15 9.9 11.2 11.2-7.05 1.3-10.05 4.3-11.2 11.2C10.85 16.3 7.85 13.3.8 12 7.85 10.7 10.85 7.7 12 .8Z" fill="#FBF08A" stroke="#250220" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 6.6c.6 2.9 1.9 4.2 4.8 4.8-2.9.6-4.2 1.9-4.8 4.8-.6-2.9-1.9-4.2-4.8-4.8 2.9-.6 4.2-1.9 4.8-4.8Z" fill="#FFFDF2"/></svg>';
let fx = null;
function burst(el, n, spread){
  if(reduce() || !el || !fx) return;
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for(let i = 0; i < n; i++){
    const s = document.createElement('div');
    s.className = 'star'; s.innerHTML = STAR;
    const size = 13 + Math.random() * 22;
    s.style.left = cx + 'px'; s.style.top = cy + 'px';
    s.style.width = size + 'px'; s.style.height = size + 'px';
    fx.appendChild(s);
    const sp = spread || 170;
    const ang = (-90 + (Math.random() * sp - sp / 2)) * Math.PI / 180;
    const dist = 55 + Math.random() * 115;
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
    const rot = Math.random() * 200 - 100;
    s.animate([
      {transform:'translate(-50%,-50%) scale(0) rotate(0deg)', opacity:0},
      {transform:`translate(calc(-50% + ${dx*.5}px),calc(-50% + ${dy*.5}px)) scale(1.15) rotate(${rot*.55}deg)`, opacity:1, offset:.32},
      {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.15) rotate(${rot}deg)`, opacity:0}
    ], {duration:600 + Math.random()*300, easing:'cubic-bezier(.2,.75,.3,1)', delay:Math.random()*90})
     .onfinish = () => s.remove();
  }
}

/* ========== 押された感じ ========== */
function squish(el, strong){
  if(!el || reduce()) return;
  const sx = strong ? 1.12 : 1.06, sy = strong ? .84 : .91;
  el.animate([
    {transform:'translateY(0) scale(1,1)'},
    {transform:`translateY(4px) scale(${sx},${sy})`, offset:.24},
    {transform:'translateY(-3px) scale(.96,1.06)', offset:.56},
    {transform:'translateY(0) scale(1,1)'}
  ], {duration:360, easing:'cubic-bezier(.25,.85,.3,1)'});
}

/* ========== 本体 ========== */
function init(cfg){
  const S = cfg.steps || [];
  const CH = cfg.chapters || [''];
  if(!S.length) throw new Error('kamishibai: steps が空です');
  soundOn = cfg.sound !== false;
  voice = cfg.sound === 'chip' ? 'chip' : 'soft';   /* true なら従来の音 */

  document.body.insertAdjacentHTML('afterbegin', `
<div id="fx" aria-hidden="true"></div>
<div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
<div class="app">
<div class="top"><div class="top-in">
  <div class="brand">${esc(cfg.brand?.name||'')}${cfg.brand?.sub?`<i>${esc(cfg.brand.sub)}</i>`:''}</div>
  <div class="chaps" id="k-chaps"></div>
  <button class="mute" id="k-mute" aria-pressed="false" aria-label="音のオン・オフ">🔊</button>
  <div class="stepn" id="k-stepn"></div>
</div></div>
<main><div class="pagetag" id="k-tag"></div><div id="k-stage"></div></main>
<div class="guide"><div class="guide-in">
  <div class="talkwrap" id="k-talkwrap" hidden>
    ${cfg.guide?.still ? `<button class="charwrap" id="k-charwrap" aria-label="ガイドをつつく"><img class="char" id="k-char" alt=""></button>` : ''}
    <div class="talk"><div class="t" id="k-talk"></div></div>
  </div>
  <div class="nav">
    <button class="gbtn" id="k-gbtn" aria-expanded="false" aria-controls="k-talkwrap" aria-label="解説を見る">
      ${cfg.guide?.loop ? '<video class="charSm" id="k-charsm" autoplay loop muted playsinline disablepictureinpicture aria-hidden="true"></video>'
        : cfg.guide?.face ? '<img class="charSm" id="k-charface" alt="">' : '<span class="face">◆</span>'}
      <span class="badge">?</span></button>
    <button class="btn" id="k-prev">${esc(cfg.labels?.prev||'もどる')}</button>
    <button class="btn go" id="k-next">${esc(cfg.labels?.next||'つぎへ')}</button>
  </div>
</div></div>
</div>`);

  fx = document.getElementById('fx');
  const stage = document.getElementById('k-stage'), chapsEl = document.getElementById('k-chaps'),
        stepn = document.getElementById('k-stepn'), tag = document.getElementById('k-tag'),
        wrap = document.getElementById('k-talkwrap'), talkT = document.getElementById('k-talk'),
        gbtn = document.getElementById('k-gbtn'), mute = document.getElementById('k-mute'),
        bPrev = document.getElementById('k-prev'), bNext = document.getElementById('k-next'),
        charwrap = document.getElementById('k-charwrap'), charImg = document.getElementById('k-char'),
        charSm = document.getElementById('k-charsm');

  if(charImg && cfg.guide?.still) charImg.src = cfg.guide.still;
  const charFace = document.getElementById('k-charface');
  if(charFace && cfg.guide?.face) charFace.src = cfg.guide.face;
  if(charSm && cfg.guide?.loop){ charSm.src = cfg.guide.loop; const po = cfg.guide.face || cfg.guide.still; if(po) charSm.poster = po; charSm.play().catch(()=>{}); }

  const body = s => s.cover
    ? `<div class="cover"><div class="num">${esc(s.cover.num)}</div><div class="ttl">${esc(s.cover.title)}</div>${s.cover.sub?`<div class="sub">${esc(s.cover.sub)}</div>`:''}</div>`
    : (s.html || '');
  stage.innerHTML = S.map((s,i) => `<div class="step" id="k-st${i}">${body(s)}</div>`).join('');

  chapsEl.innerHTML = CH.map((nm, ci) => {
    const n = S.filter(s => (s.ch|0) === ci).length;
    const first = S.findIndex(s => (s.ch|0) === ci);
    return `<div class="chap">` + Array.from({length:n}, (_,k) =>
      `<button class="b" data-g="${first+k}" aria-label="${esc(nm)} ${k+1}"></button>`).join('') + `</div>`;
  }).join('');
  chapsEl.querySelectorAll('[data-g]').forEach(b => b.onclick = () => go(+b.dataset.g));

  let cur = 0;
  function countUp(el){
    const to = +el.dataset.to; if(!to) return;
    const t0 = performance.now();
    (function t(n){
      const p = Math.min(1, (n - t0) / 1000), e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(to * e);
      if(p < 1) requestAnimationFrame(t);
      else el.animate([{transform:'scale(1)'},{transform:'scale(1.16)'},{transform:'scale(1)'}],{duration:340,easing:'ease-out'});
    })(t0);
  }
  function go(i){
    cur = Math.max(0, Math.min(S.length - 1, i));
    document.querySelectorAll('.step').forEach((el, j) => el.classList.toggle('on', j === cur));
    chapsEl.querySelectorAll('[data-g]').forEach(b => {
      const g = +b.dataset.g; b.classList.toggle('on', g === cur); b.classList.toggle('done', g < cur);
    });
    stepn.textContent = (cur + 1) + ' / ' + S.length;
    tag.textContent = S[cur].tag || '';
    tag.style.animation = 'none'; void tag.offsetWidth; tag.style.animation = '';
    bPrev.disabled = cur === 0;
    bNext.textContent = cur === S.length - 1 ? (cfg.labels?.end || 'おわり！')
                      : (S[cur].cover ? (cfg.labels?.start || 'はじめる') : (cfg.labels?.next || 'つぎへ'));
    bNext.disabled = cur === S.length - 1;
    /* 解説を開いたまま送れる。開いていたら次の画面の解説に差し替え、閉じていたら閉じたまま。
       毎回閉じると、解説を読みながら進みたい人が1画面ごとに◆を押し直すことになる。 */
    const wasOpen = !wrap.hidden;
    talkT.innerHTML = S[cur].talk || '';
    const keep = wasOpen && !!S[cur].talk;          /* 解説の無い画面では閉じる */
    wrap.hidden = !keep; gbtn.setAttribute('aria-expanded', String(keep));
    if(keep){ wrap.style.animation='none'; void wrap.offsetWidth; wrap.style.animation=''; }
    global.scrollTo({top:0, behavior:'instant'});
    const el = document.getElementById('k-st' + cur);
    el.querySelectorAll('[data-to]').forEach(countUp);
    if(typeof S[cur].onShow === 'function') S[cur].onShow(el, {chime, burst, squish});
  }

  mute.onclick = () => { soundOn = !soundOn; mute.setAttribute('aria-pressed', String(!soundOn));
    mute.textContent = soundOn ? '🔊' : '🔇'; squish(mute); if(soundOn) chime('open'); };
  gbtn.onclick = () => { const open = wrap.hidden; wrap.hidden = !open;
    gbtn.setAttribute('aria-expanded', String(open)); squish(gbtn);
    if(open){ chime('open'); burst(gbtn, 7, 200);
      wrap.style.animation='none'; void wrap.offsetWidth; wrap.style.animation='';
      if(charwrap){ charwrap.style.animation='none'; void charwrap.offsetWidth; charwrap.style.animation=''; } } };
  if(charwrap) charwrap.addEventListener('click', e => { e.preventDefault();
    squish(charImg, true); burst(charwrap, 13, 250); chime('tap'); });
  bNext.onclick = () => { const last = cur === S.length - 2;
    chime(last ? 'fin' : 'next'); burst(bNext, last ? 18 : 10, last ? 260 : 170); squish(bNext); go(cur + 1); };
  bPrev.onclick = () => { chime('back'); burst(bPrev, 5, 120); squish(bPrev); go(cur - 1); };
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a.tdo');
    if(a){ chime('tap'); burst(a, 8, 200); } }, true);
  /* ---------- 左右スワイプ ---------- */
  (function(){
    let x0=null, y0=null, t0=0, lock=false;
    const on=(t,f)=>document.addEventListener(t,f,{passive:true});
    const reset=()=>{ x0=null;
      stage.style.transition='transform .28s cubic-bezier(.2,.8,.3,1)';
      stage.style.transform=''; };
    on('touchstart', e=>{
      if(e.touches.length!==1){ x0=null; return; }
      const t=e.touches[0];
      x0=t.clientX; y0=t.clientY; t0=Date.now(); lock=false;
      stage.style.transition='none';
    });
    on('touchmove', e=>{
      if(x0===null || e.touches.length!==1) return;
      const t=e.touches[0], dx=t.clientX-x0, dy=t.clientY-y0;
      if(!lock && Math.abs(dx)>14 && Math.abs(dx)>Math.abs(dy)*1.4) lock=true;
      if(lock){
        const edge = (dx<0 && bNext.disabled) || (dx>0 && bPrev.disabled);
        stage.style.transform=`translateX(${dx*(edge?0.09:0.3)}px)`;
      }
    });
    on('touchend', e=>{
      if(x0===null) return;
      const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0, dt=Date.now()-t0;
      const go = lock && dt<800 && Math.abs(dx)>=58 && Math.abs(dx)>Math.abs(dy)*1.4;
      reset();
      if(!go) return;
      if(dx<0){ if(!bNext.disabled) bNext.click(); }
      else if(!bPrev.disabled) bPrev.click();
    });
    on('touchcancel', reset);
  })();

  addEventListener('keydown', e => {
    if(e.key === 'ArrowRight' || e.key === ' ') { bNext.disabled || bNext.click(); }
    if(e.key === 'ArrowLeft') { bPrev.disabled || bPrev.click(); } });

  go(0);
  return {go, chime, burst, squish};
}

global.Kamishibai = {init, K, chime, burst, squish};
global.K = K;
})(window);

</script>
<script>
/* 当日の台本 — 進行役が1枚ずつ送る。
   ★参加者には配らない（進行役の手元用）。
   直し方: このファイルを直して push → GitHub Actions が index.html を組み直す（kamishibai/README.md）
   数字はすべて実測（2026-09、K151・Mac）。出典は stack-chan-DJ の docs/ と配布物10枚。 */
